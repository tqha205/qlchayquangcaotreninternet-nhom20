name: Python App Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: ads_manager_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client libmariadb-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # Remove PyQt5 for headless Linux environment in CI
          grep -v "PyQt5" requirements.txt > requirements-test.txt
          pip install -r requirements-test.txt

      - name: Run Database Migrations or Setup
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ""
          DB_NAME: ads_manager_db
        run: |
          # Seed / Initialize test database if required
          # We can use the setup script or just run migrations
          python -c "import mysql.connector; conn = mysql.connector.connect(host='127.0.0.1', user='root'); cursor = conn.cursor(); cursor.execute('CREATE DATABASE IF NOT EXISTS ads_manager_db;'); conn.close()"
          python database/migrate_phase1.py || echo "Migration skipped or already done"

      - name: Run Tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ""
          DB_NAME: ads_manager_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: super_secret_key_rbac_system
        run: |
          pytest
