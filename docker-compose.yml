version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ads_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ads_manager_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ads_redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: ads_flask_web
    restart: always
    command: python run.py
    ports:
      - "5001:5001"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root_password
      - DB_NAME=ads_manager_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=super_secret_key_rbac_system
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build: .
    container_name: ads_celery_worker
    restart: always
    command: celery -A celery_worker.celery worker --loglevel=info
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root_password
      - DB_NAME=ads_manager_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=super_secret_key_rbac_system
    depends_on:
      - db
      - redis

volumes:
  mysql_data:
